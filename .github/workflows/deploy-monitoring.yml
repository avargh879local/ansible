name: Provision Free VM + Deploy Prometheus/Grafana

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '*/10 * * * *'  # Retry every 10 min if capacity low

jobs:
  provision-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OCI CLI & jq
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.py | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          sudo apt install -y jq  # For JSON parsing

      - name: Setup OCI Config from JSON Secret
        env:
          OCI_JSON: ${{ secrets.OCI_CREDENTIALS }}
        run: |
          mkdir -p ~/.oci
          echo "$OCI_JSON" > oci.json
          TENANCY=$(jq -r '.tenancy' oci.json)
          USER=$(jq -r '.user' oci.json)
          REGION=$(jq -r '.region' oci.json)
          FINGERPRINT=$(jq -r '.fingerprint' oci.json)
          KEY_CONTENT=$(jq -r '.key_content' oci.json)
          COMPARTMENT=$(jq -r '.compartment_id' oci.json)
          SUBNET=$(jq -r '.subnet_id' oci.json)
          IMAGE=$(jq -r '.image_id' oci.json)
          AD=$(jq -r '.ad_name' oci.json)
          SSH_PUB=$(jq -r '.ssh_public_key' oci.json)
          ANSIBLE_KEY=$(jq -r '.ansible_ssh_key' oci.json)

          cat > ~/.oci/config << 'EOF'
          [DEFAULT]
          user=$USER
          fingerprint=$FINGERPRINT
          key_content=$(echo -n "$KEY_CONTENT" | sed 's/\\n/\\\\n/g')  # Proper escape
          tenancy=$TENANCY
          region=$REGION
          EOF

      - name: Create Free VM Instance
        id: create_vm
        run: |
          INSTANCE_ID=$(oci compute instance launch \
            --compartment-id $COMPARTMENT \
            --availability-domain "$AD" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":4,"memoryInGBs":24}' \
            --subnet-id $SUBNET \
            --image-id $IMAGE \
            --display-name "Monitoring-VM" \
            --boot-volume-size-in-gbs 200 \
            --ssh-authorized-keys "$SSH_PUB" \
            --query data.id --raw-output)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

          # Wait for IP
          for i in {1..30}; do
            IP=$(oci compute instance list-vnics --instance-id $INSTANCE_ID --query "data[0].public-ip" --raw-output)
            if [ -n "$IP" ]; then echo "public_ip=$IP" >> $GITHUB_OUTPUT; break; fi
            sleep 10
          done

      - name: Install Ansible
        run: sudo apt update && sudo apt install -y ansible

      - name: Update Inventory with New VM IP
        run: |
          sed -i "s/<IP_of_Server_B>/${{ steps.create_vm.outputs.public_ip }}/g" inventory/hosts.yml
          sed -i "s/<IP_of_Server_C>/${{ steps.create_vm.outputs.public_ip }}/g" inventory/hosts.yml
          sed -i "s/<IP_of_Slave1>/${{ steps.create_vm.outputs.public_ip }}/g" inventory/hosts.yml  # Add more if needed

      - name: Deploy Prometheus + Grafana
        run: |
          ansible-playbook -i inventory/hosts.yml playbooks/prometheus.yml --private-key <(echo "$ANSIBLE_KEY") -u ubuntu
          ansible-playbook -i inventory/hosts.yml playbooks/grafana.yml --private-key <(echo "$ANSIBLE_KEY") -u ubuntu

      - name: Notify Success
        if: success()
        run: echo "Your monitoring stack is live at http://${{ steps.create_vm.outputs.public_ip }}:3000 (Grafana default user/pass: admin/admin)"
